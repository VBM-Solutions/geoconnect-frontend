name: CI / CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint / Build / Tests
  # ─────────────────────────────────────────────
  build:
    name: Build & Tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Tests with coverage
        run: npm run test:coverage

  # ─────────────────────────────────────────────
  # 2. Analyse SonarCloud
  # ─────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with coverage (pour SonarCloud)
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────
  # 3. Build image Docker → push sur GHCR
  # Seulement sur push (pas les PRs).
  # develop → tag "staging"   + BUILD_MODE=staging
  # main    → tag "production" + BUILD_MODE=production
  # ─────────────────────────────────────────────
  build-images:
    name: Build & Push Docker image (GHCR)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Déterminer le tag, le mode, l'owner lowercase et le SHA
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=production" >> $GITHUB_OUTPUT
            echo "build_mode=production" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
            echo "build_mode=staging" >> $GITHUB_OUTPUT
          fi
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "sha=production-sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "sha=staging-sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Déterminer VITE_API_URL
        id: vite
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "api_url=${{ vars.VITE_API_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "api_url=${{ vars.VITE_API_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Login → GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/geoconnect-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/geoconnect-frontend:${{ steps.meta.outputs.sha }}
          build-args: |
            VITE_API_URL=${{ steps.vite.outputs.api_url }}
            BUILD_MODE=${{ steps.meta.outputs.build_mode }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 4. Update Infra Repo (staging SHA tag)
  # ─────────────────────────────────────────────
  update-infra:
    name: Update Infra Repo
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: VBM-Solutions/geoconnect-infra
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra

      - name: Determine SHA tag
        id: meta
        run: |
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          echo "sha=staging-sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Update docker-compose with SHA tag
        run: |
          sed -i "s/TAG_PLACEHOLDER/${{ steps.meta.outputs.sha }}/g" infra/staging/docker-compose-frontend.yml

      - name: Commit and push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add staging/docker-compose-frontend.yml
          git diff --cached --quiet || (git commit -m "deploy(staging): update frontend to ${{ steps.meta.outputs.sha }}" && git push origin main)
