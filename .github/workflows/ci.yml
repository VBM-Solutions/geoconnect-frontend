name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/geoconnect-frontend

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1 : Lint / Tests / Sonar
  # ──────────────────────────────────────────────────────────────
  ci:
    name: Lint / Build / Test / Sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Tests with coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Job 2a : Build & Push image Docker — Staging (develop)
  # ──────────────────────────────────────────────────────────────
  build-staging:
    name: Build image → ghcr.io (staging)
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    permissions:
      contents: read
      packages: write
      actions: write   # nécessaire pour le cache type=gha
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            BUILD_MODE=staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Job 3a : Déploiement Staging → Coolify pull l'image
  # ──────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: build-staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.mon-etude-de-sol.fr
    steps:
      - name: Trigger Coolify redeploy (staging)
        run: |
          curl --silent --show-error --fail \
            --request GET \
            --url "${{ secrets.COOLIFY_WEBHOOK_STAGING }}"

  # ──────────────────────────────────────────────────────────────
  # Job 2b : Build & Push image Docker — Production (main)
  # ──────────────────────────────────────────────────────────────
  build-production:
    name: Build image → ghcr.io (production)
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write
      actions: write   # nécessaire pour le cache type=gha
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=raw,value=latest
            type=sha,prefix=prod-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            BUILD_MODE=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Job 3b : Déploiement Production → Coolify pull l'image
  # (nécessite une approbation manuelle via GitHub Environment)
  # ──────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    needs: build-production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mon-etude-de-sol.fr
    steps:
      - name: Trigger Coolify redeploy (production)
        run: |
          curl --silent --show-error --fail \
            --request GET \
            --url "${{ secrets.COOLIFY_WEBHOOK_PRODUCTION }}"
