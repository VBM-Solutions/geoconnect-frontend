name: CI / CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint / Build / Tests
  # ─────────────────────────────────────────────
  build:
    name: Build & Tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Tests with coverage
        run: npm run test:coverage

  # ─────────────────────────────────────────────
  # 2. Analyse SonarCloud
  # ─────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with coverage (pour SonarCloud)
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────
  # 3. Build image Docker → push sur GHCR
  # Seulement sur push (pas les PRs).
  # develop → tag "staging"   + BUILD_MODE=staging
  # main    → tag "production" + BUILD_MODE=production
  # ─────────────────────────────────────────────
  build-images:
    name: Build & Push Docker image (GHCR)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Déterminer le tag, le mode et l'owner lowercase
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=production" >> $GITHUB_OUTPUT
            echo "build_mode=production" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
            echo "build_mode=staging" >> $GITHUB_OUTPUT
          fi
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Déterminer VITE_API_URL
        id: vite
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "api_url=${{ vars.VITE_API_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "api_url=${{ vars.VITE_API_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Login → GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/geoconnect-frontend:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_API_URL=${{ steps.vite.outputs.api_url }}
            BUILD_MODE=${{ steps.meta.outputs.build_mode }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 4. Déploiement Staging (branche develop)
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Trigger Coolify Staging Deploy
        run: |
          if [ -z "${{ secrets.COOLIFY_STAGING_WEBHOOK_URL }}" ] || [ -z "${{ secrets.COOLIFY_STAGING_TOKEN }}" ]; then
            echo "⚠️  COOLIFY_STAGING_WEBHOOK_URL ou COOLIFY_STAGING_TOKEN non configurés — déploiement ignoré."
            exit 0
          fi
          curl --silent --fail --show-error \
            --request GET \
            "${{ secrets.COOLIFY_STAGING_WEBHOOK_URL }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_STAGING_TOKEN }}"

  # ─────────────────────────────────────────────
  # 5. Déploiement Production (branche main)
  # Requiert une approbation manuelle.
  # ─────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    needs: [ build-images, sonar ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Trigger Coolify Production Deploy
        run: |
          if [ -z "${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_URL }}" ] || [ -z "${{ secrets.COOLIFY_PRODUCTION_TOKEN }}" ]; then
            echo "⚠️  COOLIFY_PRODUCTION_WEBHOOK_URL ou COOLIFY_PRODUCTION_TOKEN non configurés — déploiement ignoré."
            exit 0
          fi
          curl --silent --fail --show-error \
            --request GET \
            "${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_URL }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_PRODUCTION_TOKEN }}"
