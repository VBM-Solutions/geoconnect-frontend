server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ──────────────────────────────────────────
    # Compression gzip
    # ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # ──────────────────────────────────────────
    # Cache des assets statiques (hachés par Vite)
    # ──────────────────────────────────────────
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ──────────────────────────────────────────
    # Proxy vers le backend Spring Boot pour /api
    # Les cookies HttpOnly de session et le cookie CSRF sont transmis tels quels.
    # ──────────────────────────────────────────
    location /api {
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts adaptés aux uploads de documents
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        client_max_body_size  50m;

    }

    # Pages publiques de bureaux d'études rendues côté serveur.
    # Le HTML initial contient le contenu et toutes les métadonnées SEO.
    location ~ ^/bureaux-etudes/[a-z0-9]+(?:-[a-z0-9]+)*$ {
        rewrite ^/bureaux-etudes/(.*)$ /api/public/seo/bureaux-etudes/$1 break;
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            "";
    }

    location = /sitemap.xml {
        proxy_pass         ${BACKEND_URL}/api/public/seo/sitemap.xml;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass         ${BACKEND_URL}/api/public/seo/robots.txt;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ──────────────────────────────────────────
    # SPA fallback : toutes les routes inconnues
    # renvoient index.html (React Router)
    # ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Pas de cache sur index.html
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ──────────────────────────────────────────
    # En-têtes de sécurité
    # ──────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=()" always;
}

