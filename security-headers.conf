add_header X-Frame-Options           "SAMEORIGIN" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy   "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security $strict_transport_security always;
